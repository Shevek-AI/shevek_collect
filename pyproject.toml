[project]
name = "shevek-collect"
version = "0.3.0"
description = "Local evidence collector for Git, GitHub and Azure DevOps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Shevek Pty Ltd"}]
dependencies = [
  "PyYAML>=6.0.0",
  "tree-sitter>=0.22",
  "tree-sitter-bash>=0.25.1",
  "tree-sitter-c-sharp>=0.23.5",
  "tree-sitter-cpp>=0.23.4",
  "tree-sitter-css>=0.23.2",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-julia>=0.23.1",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
shevek-collect = "shevek_collect.cli:main"

[project.urls]
Homepage = "https://shevek.com.au"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shevek_collect"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/examples", "/.github",
  "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md",
  "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock", "/.gitignore", "/.gitleaks.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
